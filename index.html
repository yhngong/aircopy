<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirCopy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">📋</span>
        <h1>AirCopy</h1>
      </div>
      <p class="subtitle">Quick and seamless copy & paste across devices</p>
    </header>

    <main class="main-content">
      <section class="card intro-card">
        <h2>Welcome to AirCopy</h2>
        <p>Ready to build static web capabilities for GitHub Pages hosting.</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>Powered by HTML5 • Ready for GitHub Pages</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
